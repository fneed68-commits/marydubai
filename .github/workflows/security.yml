name: 🛡️ Security

on:
  push:
    branches: [ main ]
  schedule:
    # كل يوم أحد الساعة 6 صباحاً
    - cron: '0 6 * * 0'

jobs:
  security:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: 🐍 Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    
    - name: 🛡️ Run Bandit (Python security)
      run: |
        pip install bandit
        bandit -r . -f json -o bandit-report.json || true
        bandit -r . --skip B101,B601 || true
      continue-on-error: true
    
    - name: 🔍 Check for secrets
      run: |
        # ابحث عن كلمات مرور أو tokens في الكود
        ! grep -r "ghp_\|password\s*=\s*['\"]\|secret\s*=\s*['\"]" \
          --include="*.py" --include="*.md" . || \
          (echo "⚠️ Possible secrets found" && exit 1)
      continue-on-error: true
    
    - name: 📤 Upload report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: security-reports
        path: bandit-report.json
        if-no-files-found: ignore
