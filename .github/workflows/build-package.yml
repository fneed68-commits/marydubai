name: 📦 Build Package

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 📦 Build archive
        run: |
          set +e
          
          echo "🔨 Building archive..."
          
          # تجاهل تحذير tar
          tar -czf /tmp/marydubai_latest.tar.gz \
            --exclude='.git' \
            --exclude='__pycache__' \
            --exclude='.github' \
            --exclude='*.pyc' \
            --exclude='*.db' \
            --exclude='*.tar.gz' \
            --exclude='*.backup*' \
            . 2>/dev/null
          
          # تحقق يدوياً
          if [ -f /tmp/marydubai_latest.tar.gz ]; then
            echo "✅ Archive created successfully"
            ls -la /tmp/marydubai_latest.tar.gz
            
            # انقل للمجلد
            mv /tmp/marydubai_latest.tar.gz ./marydubai_latest.tar.gz
            ls -la marydubai_latest.tar.gz
          else
            echo "❌ Archive not found"
            exit 1
          fi
          
          echo "✅ Build complete"

      - name: 📤 Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: marydubai-package
          path: marydubai_latest.tar.gz
          retention-days: 30
