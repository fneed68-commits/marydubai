name: 📦 Build Package

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 🧹 Clean workspace
        run: |
          find . -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true
          find . -type f -name "*.pyc" -delete 2>/dev/null || true
          find . -type f -name "*.backup*" -delete 2>/dev/null || true
          find . -type f -name "*.db" -delete 2>/dev/null || true
          find . -type f -name "*.tar.gz" -delete 2>/dev/null || true

      - name: 📦 Build archive
        run: |
          # في Ubuntu، /tmp موجود (نفس فكرة $TMPDIR في Termux)
          tar -czf /tmp/marydubai_latest.tar.gz \
            --exclude='.git' \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            --exclude='*.db' \
            --exclude='*.backup*' \
            --exclude='*.tar.gz' \
            --warning=no-file-changed \
            . 2>/dev/null
          
          # انقل للمجلد الحالي
          mv /tmp/marydubai_latest.tar.gz ./marydubai_latest.tar.gz
          
          echo "✅ Archive created"
          ls -la marydubai_latest.tar.gz

      - name: 📤 Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: marydubai-package
          path: marydubai_latest.tar.gz
          retention-days: 30

      - name: 📊 Report size
        run: |
          SIZE=$(du -h marydubai_latest.tar.gz | cut -f1)
          echo "## 📦 Package Built" >> $GITHUB_STEP_SUMMARY
          echo "**Size:** $SIZE" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ✅ Success" >> $GITHUB_STEP_SUMMARY
