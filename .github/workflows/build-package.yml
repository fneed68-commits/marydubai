name: 📦 Build Package

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 🧹 Clean workspace
        shell: bash
        run: |
          set +e  # ← تعطيل exit-on-error
          find . -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null
          find . -type f -name "*.pyc" -delete 2>/dev/null
          find . -type f -name "*.backup*" -delete 2>/dev/null
          find . -type f -name "*.db" -delete 2>/dev/null
          find . -type f -name "*.tar.gz" -delete 2>/dev/null
          echo "✅ Workspace clean"

      - name: 📦 Build archive
        shell: bash
        run: |
          set +e  # ← تعطيل exit-on-error
          echo "Building archive..."
          
          tar -czf /tmp/marydubai_latest.tar.gz \
            --exclude='.git' \
            --exclude='__pycache__' \
            --exclude='.github' \
            --exclude='*.pyc' \
            --exclude='*.db' \
            --exclude='*.tar.gz' \
            . 2>&1 | grep -v "file changed"
          
          echo "Tar exit: $?"
          
          # تحقق
          if [ -f /tmp/marydubai_latest.tar.gz ]; then
            echo "✅ Archive created"
            ls -la /tmp/marydubai_latest.tar.gz
            mv /tmp/marydubai_latest.tar.gz ./marydubai_latest.tar.gz
            echo "✅ Moved to workspace"
            ls -la marydubai_latest.tar.gz
          else
            echo "❌ Archive failed"
            exit 1
          fi

      - name: 📤 Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: marydubai-package
          path: marydubai_latest.tar.gz
          retention-days: 30
